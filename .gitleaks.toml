title = "GrowFitness admin secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Firebase client configuration is public by design and is not authorization"
targetRules = ["gcp-api-key", "generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^AIzaSyAq4rHeYjdnUpZj-Buo8MhwvSZHX7-efUs$''']
paths = ['''^src/firebase/firebase\.js$''']

[[allowlists]]
description = "The reCAPTCHA Enterprise site key is a public browser identifier"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^6LfbcJQtAAAAAOXK78o6yC-7sM6VW24W9azzCIDj$''']
paths = ['''^\.env\.production$''']
